name: Check Internal Service Images

on:
  schedule:
    - cron: "47 7 * * 1"   # weekly on Monday at 07:47 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Check for new image tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Each entry: "IMAGE VALUES_PATH TAG_PATTERN [OPTION...]"
          #   VALUES_PATH: yq path in values.yaml whose `image:` field holds the
          #     authoritative current tag. The tag (everything after the last
          #     `:`) is extracted at runtime — values.yaml is the single source
          #     of truth, so the workflow never goes out of sync.
          #   TAG_PATTERN: regex matching stable tags of any version, e.g.
          #     `^\d+\.\d+\.\d+-noble$` for mariadb. Newer tags with the same
          #     major version are reported as updates; a newer major version is
          #     reported separately as a major upgrade, so it is never missed.
          # Options:
          #   gh=OWNER/REPO: fetch the latest tag from the GitHub Releases API
          #     instead of Docker Hub. Use this for images whose Docker Hub
          #     mirror is stale or absent (e.g. dragonfly, which publishes to
          #     docker.dragonflydb.io).
          #   max-major=N: ignore major versions above N, for images whose next
          #     major Seafile does not support yet. Cite the source next to it.
          #   series: the major version follows the Seafile series (companion
          #     images published by Seafile). Its majors are reported by the
          #     series issue of check-upstream.yaml, not here.
          #
          # Every image pinned in values.yaml must be listed here; the check
          # below fails the run when one is missing.
          IMAGES=(
            "library/mariadb                .seafile.database.internal.image      ^\d+\.\d+\.\d+-noble$"
            "dragonflydb/dragonfly          .seafile.cache.internal.image         ^v\d+\.\d+\.\d+$        gh=dragonflydb/dragonfly"
            # "Seafile PE 10.0 and later only supports ElasticSearch 8.x."
            # https://manual.seafile.com/14.0/setup/use_elasticsearch/
            "library/elasticsearch          .seafile.elasticsearch.internal.image ^\d+\.\d+\.\d+$          max-major=8"
            "seafileltd/seafile-md-server   .seafile.metadata.internal.image      ^\d+\.\d+\.\d+$          series"
            "seafileltd/sdoc-server         .seafile.seadoc.internal.image        ^\d+\.\d+\.\d+$          series"
            "seafileltd/notification-server .seafile.notification.internal.image  ^\d+\.\d+\.\d+$          series"
          )

          # Coverage guard: every `image:` key under an `internal:` block in
          # values.yaml must be tracked above.
          TRACKED=$(printf '%s\n' "${IMAGES[@]}" | awk '{print $2}' | sort)
          PINNED=$(yq -r '.. | select(tag == "!!map" and has("internal")) | path | "." + join(".") + ".internal.image"' values.yaml | sort)
          UNTRACKED=$(comm -13 <(echo "$TRACKED") <(echo "$PINNED"))
          if [ -n "$UNTRACKED" ]; then
            echo "Pinned images not tracked by this workflow:" >&2
            echo "$UNTRACKED" >&2
            exit 1
          fi

          # Opens an issue unless an open one with the same title exists.
          # Extra arguments are passed through to `gh issue create`.
          open_issue() {
            local title="$1" body="$2"
            shift 2
            local existing
            existing=$(gh issue list --search "\"${title}\" in:title" --state open --json number --jq length)
            if [ "$existing" = "0" ]; then
              gh issue create --title "$title" --label "dependency-update" --body "$body" "$@"
              echo "Created issue: ${title}"
            else
              echo "Issue already exists: ${title}"
            fi
          }

          for ENTRY in "${IMAGES[@]}"; do
            read -r REPO VALUES_PATH PATTERN OPTIONS <<< "$ENTRY"
            GH_REPO="" MAX_MAJOR="" SERIES=""
            for OPT in ${OPTIONS:-}; do
              case "$OPT" in
                gh=*)        GH_REPO="${OPT#gh=}" ;;
                max-major=*) MAX_MAJOR="${OPT#max-major=}" ;;
                series)      SERIES=yes ;;
                *) echo "Unknown option '${OPT}' for ${REPO}" >&2; exit 1 ;;
              esac
            done

            # Extract current tag from values.yaml (everything after last `:`)
            IMAGE_REF=$(yq -r "${VALUES_PATH}" values.yaml)
            if [ -z "$IMAGE_REF" ] || [ "$IMAGE_REF" = "null" ]; then
              echo "=== ${REPO}: could not read ${VALUES_PATH} from values.yaml, skipping ==="
              continue
            fi
            CURRENT="${IMAGE_REF##*:}"
            echo "=== Checking ${REPO} (current: ${CURRENT}, from ${VALUES_PATH}) ==="

            if [ -n "$GH_REPO" ]; then
              TAGS=$(curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${GH_REPO}/releases/latest" \
                | python3 -c "import sys, json; print(json.load(sys.stdin).get('tag_name') or '')")
            else
              TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${REPO}/tags/?page_size=100&ordering=last_updated" \
                | python3 -c "import sys, json; print('\n'.join(r['name'] for r in json.load(sys.stdin)['results']))")
            fi

            # Prints two words: the newest matching tag with the current major
            # version, and the newest matching tag of any major ("-" if none).
            read -r LATEST NEWEST <<< "$(echo "$TAGS" | python3 -c "
          import sys, re
          pattern = re.compile(r'${PATTERN}')
          nums = lambda tag: list(map(int, re.findall(r'\d+', tag)))
          tags = [t for t in sys.stdin.read().split() if pattern.match(t)]
          if '${MAX_MAJOR}':
              tags = [t for t in tags if nums(t)[0] <= int('${MAX_MAJOR}')]
          major = nums('${CURRENT}')[0]
          same = [t for t in tags if nums(t)[0] == major]
          print(max(same, key=nums, default='-'), max(tags, key=nums, default='-'))
          ")"

            echo "Latest with same major: ${LATEST}"
            echo "Latest overall: ${NEWEST}"

            # Short name for the image (e.g. "mariadb", "redis", "elasticsearch")
            SHORT=${REPO#library/}
            # Values key as shown in the issue body: strip the leading `.`
            # from the yq path (`.seafile.foo.internal.image` →
            # `seafile.foo.internal.image`).
            VALUES_KEY="${VALUES_PATH#.}"

            NEWER=$(python3 -c "
          import re
          def nums(tag):
              return list(map(int, re.findall(r'\d+', tag)))
          print('yes' if '${LATEST}' != '-' and nums('${LATEST}') > nums('${CURRENT}') else 'no')
          ")
            if [ "$NEWER" = "yes" ]; then
              open_issue "New ${SHORT} image: ${LATEST} (current: ${CURRENT})" "$(cat <<EOF
          A newer \`${SHORT}\` image tag has been detected upstream.

          | | Version |
          |---|---|
          | **Current (values.yaml)** | \`${CURRENT}\` |
          | **Latest upstream** | \`${LATEST}\` |
          | **Image** | \`${SHORT}:${LATEST}\` |
          | **Values key** | \`${VALUES_KEY}\` |

          ### Steps
          1. Update the image tag at \`${VALUES_KEY}\` in \`values.yaml\`
          2. Test with the internal mode enabled for this component
          3. Bump chart version and release
          EOF
          )"
            else
              echo "No newer tag with the same major version."
            fi

            # A newer major version is reported separately, titled by major
            # so that later releases of it don't open further issues.
            if [ -n "$SERIES" ]; then
              echo "Major follows the Seafile series; reported by check-upstream."
              continue
            fi
            NEW_MAJOR=$(python3 -c "
          import re
          nums = lambda tag: list(map(int, re.findall(r'\d+', tag)))
          print(nums('${NEWEST}')[0] if '${NEWEST}' != '-' and nums('${NEWEST}')[0] > nums('${CURRENT}')[0] else '')
          ")
            if [ -n "$NEW_MAJOR" ]; then
              open_issue "New ${SHORT} major version ${NEW_MAJOR} available (current: ${CURRENT})" "$(cat <<EOF
          A newer **major version** of \`${SHORT}\` has been detected upstream. This is
          a major upgrade: check compatibility with the deployed Seafile version and
          the upstream upgrade notes before bumping.

          | | Version |
          |---|---|
          | **Current (values.yaml)** | \`${CURRENT}\` |
          | **Newest upstream** | \`${NEWEST}\` |
          | **Image** | \`${SHORT}:${NEWEST}\` |
          | **Values key** | \`${VALUES_KEY}\` |
          EOF
          )" --assignee ioanalytica
            fi
          done
